<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles y Permisos - Administración</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <script>
    const SUPABASE_URL = 'https://ynojotdgegfmwueksjma.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlub2pvdGRnZWdmbXd1ZWtzam1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDEwMjIsImV4cCI6MjEwNTA3NzAyMn0.cPd5_f3529iFvLWJDhkQ_KNanD6D_YLcZkU67MtHAds';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>

  <style>
    .bg-dashboard-custom {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 58, 138, 0.90)), url('img/bg-login.jpg');
      background-size: cover; background-position: center; background-attachment: fixed;
    }
  </style>
</head>
<body class="bg-dashboard-custom min-h-screen text-slate-100 font-sans antialiased flex flex-col">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-h-screen w-full md:pl-28 transition-all duration-300">
    <main class="p-4 sm:p-8 flex-1 space-y-6 max-w-7xl mx-auto w-full">
      
      <!-- CABECERA -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-700/60 shadow-2xl">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-white flex items-center">
            <i class="fa-solid fa-shield-halved text-amber-400 mr-3"></i> Catálogo de Roles y Facultades
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">Asignación de permisos por módulo institucional</p>
        </div>

        <button onclick="abrirModalRol()" class="px-5 py-3 bg-amber-600 hover:bg-amber-500 text-white font-extrabold rounded-2xl shadow-lg transition flex items-center space-x-2 text-xs">
          <i class="fa-solid fa-shield-plus"></i>
          <span>Crear Nuevo Rol</span>
        </button>
      </div>

      <!-- GRID DE ROLES -->
      <div class="bg-slate-900/80 backdrop-blur-xl rounded-3xl border border-slate-700/60 p-6 shadow-2xl space-y-4">
        <div id="contenedor-roles" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
          <p class="text-slate-500 py-6 text-center col-span-3">Cargando catálogo de roles...</p>
        </div>
      </div>

    </main>
  </div>

  <!-- MODAL EDITAR / CREAR ROL -->
  <div id="modal-rol" class="fixed inset-0 bg-slate-950/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-700/80 rounded-3xl shadow-2xl max-w-lg w-full p-6 text-slate-100 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
        <h3 id="modal-rol-titulo" class="text-base font-bold text-white flex items-center"><i class="fa-solid fa-shield-plus text-amber-400 mr-2"></i> Registrar Nuevo Rol</h3>
        <button onclick="cerrarModalRol()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form onsubmit="guardarRol(event)" class="space-y-4 text-xs">
        <input type="hidden" id="edit-rol-id">
        
        <div>
          <label class="block font-semibold text-slate-300 mb-1">Nombre del Rol (Identificador)</label>
          <input type="text" id="rol-nombre" required placeholder="Ej. auditor, juridico" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500 lowercase">
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">Descripción</label>
          <input type="text" id="rol-desc" placeholder="Descripción de funciones..." class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <div class="border-t border-slate-800 pt-3">
          <label class="block font-bold text-amber-400 mb-2">Permisos por Módulo</label>
          <div class="space-y-2 bg-slate-950/60 p-3 rounded-2xl border border-slate-800">
            <div class="flex justify-between items-center">
              <span class="font-semibold text-slate-300">Despacho (Agendas)</span>
              <select id="perm-agendas" class="bg-slate-800 border border-slate-700 p-1.5 rounded-lg text-white">
                <option value="ninguno">Sin Acceso</option>
                <option value="lectura">Lectura</option>
                <option value="control">Control Total</option>
              </select>
            </div>

            <div class="flex justify-between items-center">
              <span class="font-semibold text-slate-300">Actas de Concejo</span>
              <select id="perm-actas" class="bg-slate-800 border border-slate-700 p-1.5 rounded-lg text-white">
                <option value="ninguno">Sin Acceso</option>
                <option value="lectura">Lectura</option>
                <option value="control">Control Total</option>
              </select>
            </div>

            <div class="flex justify-between items-center">
              <span class="font-semibold text-slate-300">Expedientes</span>
              <select id="perm-expedientes" class="bg-slate-800 border border-slate-700 p-1.5 rounded-lg text-white">
                <option value="ninguno">Sin Acceso</option>
                <option value="lectura">Lectura</option>
                <option value="control">Control Total</option>
              </select>
            </div>

            <div class="flex justify-between items-center">
              <span class="font-semibold text-slate-300">Recursos Administrativos</span>
              <select id="perm-recursos" class="bg-slate-800 border border-slate-700 p-1.5 rounded-lg text-white">
                <option value="ninguno">Sin Acceso</option>
                <option value="lectura">Lectura</option>
                <option value="control">Control Total</option>
              </select>
            </div>

            <div class="flex justify-between items-center">
              <span class="font-semibold text-slate-300">Archivo General</span>
              <select id="perm-archivos" class="bg-slate-800 border border-slate-700 p-1.5 rounded-lg text-white">
                <option value="ninguno">Sin Acceso</option>
                <option value="lectura">Lectura</option>
                <option value="control">Control Total</option>
              </select>
            </div>
          </div>
        </div>

        <div class="flex justify-end space-x-2 pt-4 border-t border-slate-800">
          <button type="button" onclick="cerrarModalRol()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-semibold">Cancelar</button>
          <button type="submit" class="px-5 py-2 bg-amber-600 text-white rounded-xl font-bold shadow-lg">Guardar Rol</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const userSesion = verificarSesion();
    if (!userSesion || (userSesion.rol || '').toLowerCase() !== 'admin') {
      alert('Acceso restringido: Se requieren permisos de Administrador.');
      window.location.href = 'index.html';
    }

    let cacheRoles = [];
    cargarRoles();

    async function cargarRoles() {
      const { data } = await supabaseClient.from('roles').select('*').order('id', { ascending: true });
      cacheRoles = data || [];
      const cont = document.getElementById('contenedor-roles');

      cont.innerHTML = cacheRoles.map(r => `
        <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-700/60 flex flex-col justify-between space-y-3 shadow">
          <div>
            <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2">
              <span class="font-extrabold text-amber-400 text-sm uppercase">${r.nombre}</span>
              <button onclick="abrirModalRol(${r.id})" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-pen-to-square"></i></button>
            </div>
            <p class="text-slate-400 text-[11px] mb-3">${r.descripcion || 'Sin descripción'}</p>
            <div class="space-y-1 text-[10px] text-slate-300">
              <p><span class="text-slate-500">Agendas:</span> <span class="font-bold text-cyan-300">${(r.permisos?.agendas || 'ninguno').toUpperCase()}</span></p>
              <p><span class="text-slate-500">Actas:</span> <span class="font-bold text-cyan-300">${(r.permisos?.actas || 'ninguno').toUpperCase()}</span></p>
              <p><span class="text-slate-500">Expedientes:</span> <span class="font-bold text-cyan-300">${(r.permisos?.expedientes || 'ninguno').toUpperCase()}</span></p>
              <p><span class="text-slate-500">Recursos:</span> <span class="font-bold text-amber-300">${(r.permisos?.recursos || 'ninguno').toUpperCase()}</span></p>
              <p><span class="text-slate-500">Archivos:</span> <span class="font-bold text-cyan-300">${(r.permisos?.archivos || 'ninguno').toUpperCase()}</span></p>
            </div>
          </div>
        </div>
      `).join('');
    }

    function abrirModalRol(id = null) {
      document.getElementById('modal-rol').classList.remove('hidden');
      if (id) {
        const r = cacheRoles.find(item => item.id === id);
        if (r) {
          document.getElementById('edit-rol-id').value = r.id;
          document.getElementById('rol-nombre').value = r.nombre;
          document.getElementById('rol-desc').value = r.descripcion || '';
          document.getElementById('perm-agendas').value = r.permisos?.agendas || 'ninguno';
          document.getElementById('perm-actas').value = r.permisos?.actas || 'ninguno';
          document.getElementById('perm-expedientes').value = r.permisos?.expedientes || 'ninguno';
          document.getElementById('perm-recursos').value = r.permisos?.recursos || 'ninguno';
          document.getElementById('perm-archivos').value = r.permisos?.archivos || 'ninguno';
        }
      } else {
        document.getElementById('edit-rol-id').value = '';
        document.getElementById('rol-nombre').value = '';
        document.getElementById('rol-desc').value = '';
      }
    }

    function cerrarModalRol() { document.getElementById('modal-rol').classList.add('hidden'); }

    async function guardarRol(e) {
      e.preventDefault();
      const idEdit = document.getElementById('edit-rol-id').value;
      const obj = {
        nombre: document.getElementById('rol-nombre').value.trim().toLowerCase(),
        descripcion: document.getElementById('rol-desc').value.trim(),
        permisos: {
          agendas: document.getElementById('perm-agendas').value,
          actas: document.getElementById('perm-actas').value,
          expedientes: document.getElementById('perm-expedientes').value,
          recursos: document.getElementById('perm-recursos').value,
          archivos: document.getElementById('perm-archivos').value
        }
      };

      try {
        if (idEdit) await supabaseClient.from('roles').update(obj).eq('id', idEdit);
        else await supabaseClient.from('roles').insert([obj]);
        cerrarModalRol();
        cargarRoles();
      } catch (err) { alert('Error al guardar rol.'); }
    }
  </script>
</body>
</html>
