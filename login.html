<link rel="apple-touch-icon" sizes="167x167" href="img/logo.png">

  <!-- CONFIGURACIÓN DE SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://ynojotdgegfmwueksjma.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlub2pvdGRnZWdmbXd1ZWtzam1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDEwMjIsImV4cCI6MjEwNTA3NzAyMn0.cPd5_f3529iFvLWJDhkQ_KNanD6D_YLcZkU67MtHAds';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- SCRIPT DE AUTENTICACIÓN CENTRALIZADO -->

  <style>
    .bg-login-custom {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 58, 138, 0.88)), url('img/bg-login.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

</head>
<body class="bg-login-custom min-h-screen text-slate-100 font-sans antialiased flex items-center justify-center p-4">

  <!-- CONTENEDOR DE LOGIN -->
  <div class="w-full max-w-md bg-slate-900/85 backdrop-blur-2xl border border-slate-700/70 rounded-3xl p-8 shadow-[0_0_30px_rgba(6,182,212,0.15)] space-y-6">
    
    <!-- HEADER Y LOGO -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 rounded-2xl bg-slate-800/80 border border-slate-700/80 mb-1 shadow-lg">
        <img src="img/logo.png" alt="Logo Municipalidad" class="w-12 h-12 object-contain">
      </div>
      <h1 class="text-xl font-extrabold text-white tracking-tight">Municipalidad de Quetzaltenango</h1>
      <p class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Secretaría Municipal</p>
    </div>

    <!-- MENSAJE DE ERROR O ALERTA -->
    <div id="alerta-login" class="hidden p-3 rounded-2xl bg-rose-500/20 border border-rose-500/40 text-rose-200 text-xs text-center font-semibold">
      <i class="fa-solid fa-circle-exclamation mr-1.5"></i> <span id="txt-alerta">Credenciales incorrectas</span>
    </div>

    <!-- FORMULARIO DE ACCESO -->
    <form onsubmit="procesarLogin(event)" class="space-y-4 text-xs" autocomplete="on">
      
      <!-- CAMPO USUARIO -->
      <div>
        <label for="login-usuario" class="block font-bold text-slate-300 mb-1.5">Usuario Institucional</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-user"></i>
          </div>
          <input type="text" id="login-usuario" name="username" autocomplete="username" required placeholder="Usuario" class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-2xl text-white outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition">
        </div>
      </div>

      <!-- CAMPO CONTRASEÑA -->
      <div>
        <label for="login-password" class="block font-bold text-slate-300 mb-1.5">Contraseña de Acceso</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-key"></i>
          </div>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-2xl text-white outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition">
        </div>
      </div>

      <!-- BOTÓN INGRESAR -->
      <div class="pt-2">
        <button type="submit" id="btn-submit-login" class="w-full py-3.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-extrabold rounded-2xl shadow-lg shadow-cyan-900/40 transition-all duration-200 flex items-center justify-center space-x-2 group">
          <span>Iniciar Sesión</span>
          <i class="fa-solid fa-right-to-bracket group-hover:translate-x-1 transition-transform"></i>
        </button>
      </div>

    </form>

    <!-- FOOTER -->
    <div class="text-center text-[10px] text-slate-500 border-t border-slate-800 pt-4">
      &copy; 2026 Municipalidad de Quetzaltenango &bull; Sistema de Gestión Documental
    </div>

  </div>

  <script>
    // Si ya existe una sesión iniciada activa, redirige automáticamente
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof obtenerSesionUsuario === 'function') {
        const sesion = obtenerSesionUsuario();
        if (sesion && sesion.usuario) {
          window.location.replace('index.html');
        }
      }
    });

    async function procesarLogin(e) {
      e.preventDefault();
      
      const userInput = document.getElementById('login-usuario').value.trim();
      const passInput = document.getElementById('login-password').value.trim();
      const alerta = document.getElementById('alerta-login');
      const txtAlerta = document.getElementById('txt-alerta');
      const btnSubmit = document.getElementById('btn-submit-login');

      alerta.classList.add('hidden');
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin mr-2"></i> Validando...`;

      try {
        // Consulta segura filtrando directamente en la base de datos
        const { data: user, error } = await supabaseClient
          .from('usuarios')
          .select('*')
          .eq('usuario', userInput.toLowerCase())
          .maybeSingle();

        if (error) {
          console.error("Error de Supabase:", error);
          txtAlerta.textContent = `Error en el servicio de autenticación.`;
          alerta.classList.remove('hidden');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Iniciar Sesión</span> <i class="fa-solid fa-right-to-bracket"></i>`;
          return;
        }

        // Validar si el usuario existe y si la contraseña coincide
        const bdPass = String(user?.password_hash || user?.password || '').trim();
        if (!user || bdPass !== passInput) {
          txtAlerta.textContent = 'Usuario o contraseña incorrectos.';
          alerta.classList.remove('hidden');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Iniciar Sesión</span> <i class="fa-solid fa-right-to-bracket"></i>`;
          return;
        }

        // Validar estado de la cuenta
        const estadoTexto = String(user.estado || '').toLowerCase().trim();
        if (estadoTexto === 'inactivo' || user.estado === false) {
          txtAlerta.textContent = 'Esta cuenta se encuentra desactivada.';
          alerta.classList.remove('hidden');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Iniciar Sesión</span> <i class="fa-solid fa-right-to-bracket"></i>`;
          return;
        }

        // Guardar sesión utilizando la función unificada de auth.js
        guardarSesionUsuario(user);

        // Actualizar fecha de conexión en Supabase
        await supabaseClient.from('usuarios').update({
          ultima_conexion: new Date().toISOString()
        }).eq('id', user.id);

        // Registrar ingreso en bitácora
        if (typeof registrarAccesoBitacora === 'function') {
          try {
            await registrarAccesoBitacora('INICIO_SESION');
          } catch (bErr) {
            console.error("Error al registrar bitácora:", bErr);
          }
        }

        // Redirección directa y limpia
        window.location.replace('index.html');

      } catch (err) {
        console.error("Excepción en login:", err);
        txtAlerta.textContent = 'Ocurrió un error inesperado al iniciar sesión.';
        alerta.classList.remove('hidden');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Iniciar Sesión</span> <i class="fa-solid fa-right-to-bracket"></i>`;
      }
    }
  </script>
</body>
</html>
