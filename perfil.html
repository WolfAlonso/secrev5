<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil y Conexiones - Secretaría Municipal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <script>
    const SUPABASE_URL = 'https://ynojotdgegfmwueksjma.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlub2pvdGRnZWdmbXd1ZWtzam1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDEwMjIsImV4cCI6MjEwNTA3NzAyMn0.cPd5_f3529iFvLWJDhkQ_KNanD6D_YLcZkU67MtHAds';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/notificaciones.js"></script>

  <style>
    .bg-dashboard-custom {
      background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 58, 138, 0.90)), url('img/bg-login.jpg');
      background-size: cover; background-position: center; background-attachment: fixed;
    }
  </style>
</head>
<body class="bg-dashboard-custom min-h-screen text-slate-100 font-sans antialiased flex flex-col">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-h-screen w-full md:pl-72">
    <main class="p-4 sm:p-8 flex-1 space-y-6 max-w-4xl mx-auto w-full">
      
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-800/60 backdrop-blur-md p-6 rounded-3xl border border-slate-700/50 shadow-xl">
        <div class="flex items-center space-x-4">
          <div class="relative group">
            <div id="avatar-container" class="w-20 h-20 rounded-2xl bg-cyan-600/20 border-2 border-cyan-500/50 flex items-center justify-center text-cyan-300 text-3xl font-bold shadow-[0_0_15px_rgba(6,182,212,0.3)] overflow-hidden">
              <i id="avatar-icon" class="fa-solid fa-user"></i>
              <img id="avatar-img" src="" alt="Foto Perfil" class="w-full h-full object-cover hidden">
            </div>
            <label for="input-foto-perfil" title="Cambiar Foto" class="absolute -bottom-1 -right-1 bg-cyan-600 hover:bg-cyan-500 text-white p-2 rounded-xl text-xs cursor-pointer shadow-lg transition">
              <i class="fa-solid fa-camera"></i>
            </label>
            <input type="file" id="input-foto-perfil" accept="image/*" class="hidden" onchange="subirFotoPerfil(event)">
          </div>

          <div>
            <h2 id="header-nombre" class="text-xl font-extrabold text-white tracking-tight">Cargando perfil...</h2>
            <p id="header-puesto" class="text-xs text-cyan-400 mt-0.5 font-semibold">--</p>
            <p id="header-conexion" class="text-[10px] text-emerald-400 mt-1 font-mono flex items-center"><i class="fa-solid fa-circle text-[7px] mr-1.5 animate-pulse"></i> Última conexión: --</p>
          </div>
        </div>
      </div>

      <div class="bg-slate-800/60 backdrop-blur-md rounded-3xl border border-slate-700/50 p-6 sm:p-8 shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
          <h3 class="text-base font-bold text-white flex items-center"><i class="fa-solid fa-clock-rotate-left text-cyan-400 mr-2.5"></i> Historial de Mis Conexiones y Accesos</h3>
          <span class="text-[10px] text-cyan-300 bg-cyan-950/60 border border-cyan-500/30 px-3 py-1 rounded-full font-mono">Sesiones personales</span>
        </div>
        <div id="lista-notifs-perfil" class="space-y-2 max-h-64 overflow-y-auto pr-1">
          <p class="text-slate-500 text-center py-4 text-xs">Cargando registros de conexión...</p>
        </div>
      </div>

      <div class="bg-slate-800/60 backdrop-blur-md rounded-3xl border border-slate-700/50 p-6 sm:p-8 shadow-2xl space-y-6">
        <div class="border-b border-slate-700/60 pb-4">
          <h3 class="text-base font-bold text-white flex items-center"><i class="fa-solid fa-user-gear text-cyan-400 mr-2.5"></i> Ficha de Datos Personales</h3>
        </div>

        <form onsubmit="actualizarPerfil(event)" class="space-y-4 text-xs">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="sm:col-span-2">
              <label class="block font-semibold text-slate-300 mb-1">Nombre Completo</label>
              <input type="text" id="perfil-nombre" required class="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-cyan-500 transition">
            </div>
            <div class="sm:col-span-2">
              <label class="block font-semibold text-slate-300 mb-1">Puesto o Cargo Institucional</label>
              <input type="text" id="perfil-puesto" required class="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-cyan-500 transition">
            </div>
            <div>
              <label class="block font-semibold text-slate-300 mb-1">Fecha de Nacimiento</label>
              <input type="date" id="perfil-nacimiento" class="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-cyan-500 transition">
            </div>
            <div class="flex items-center pt-5">
              <label class="flex items-center space-x-3 cursor-pointer bg-slate-900/50 p-3 rounded-xl border border-slate-700/60 w-full">
                <input type="checkbox" id="perfil-hijos" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-cyan-600 focus:ring-cyan-500">
                <span class="font-semibold text-slate-300">Tiene Hijos</span>
              </label>
            </div>
          </div>
          <div class="flex justify-end pt-4 border-t border-slate-800">
            <button type="submit" class="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-cyan-900/40">Guardar Cambios</button>
          </div>
        </form>
      </div>

      <div class="bg-slate-800/60 backdrop-blur-md rounded-3xl border border-slate-700/50 p-6 sm:p-8 shadow-2xl space-y-6">
        <div class="border-b border-slate-700/60 pb-4">
          <h3 class="text-base font-bold text-white flex items-center"><i class="fa-solid fa-key text-amber-400 mr-2.5"></i> Cambiar Contraseña</h3>
        </div>
        <form onsubmit="cambiarContrasena(event)" class="space-y-4 text-xs">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-semibold text-slate-300 mb-1">Nueva Contraseña</label>
              <input type="password" id="clave-nueva" required minlength="4" class="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
              <label class="block font-semibold text-slate-300 mb-1">Confirmar Nueva Contraseña</label>
              <input type="password" id="clave-confirmar" required minlength="4" class="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white outline-none focus:ring-2 focus:ring-amber-500">
            </div>
          </div>
          <div class="flex justify-end pt-4 border-t border-slate-800">
            <button type="submit" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-amber-900/40">Actualizar Contraseña</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="p-6 text-center text-xs text-slate-500 border-t border-slate-800/80">&copy; 2026 Municipalidad de Quetzaltenango</footer>
  </div>

  <script>
    const userSesion = verificarSesion();
    if (userSesion) {
      cargarDatosPerfil();
      cargarCentroNotificacionesPerfil();
    }

    async function cargarDatosPerfil() {
      try {
        const { data, error } = await supabaseClient.rpc('obtener_perfil_usuario', {
          p_usuario: userSesion.usuario
        });
        if (error) { console.error('Error perfil:', error); return; }
        if (!data) return;

        document.getElementById('header-nombre').textContent = data.nombre_completo || data.usuario;
        document.getElementById('header-puesto').textContent = data.puesto || 'Puesto no asignado';
        document.getElementById('perfil-nombre').value = data.nombre_completo || '';
        document.getElementById('perfil-puesto').value = data.puesto || '';
        document.getElementById('perfil-nacimiento').value = data.fecha_nacimiento || '';
        document.getElementById('perfil-hijos').checked = data.tiene_hijos || false;

        if (data.ultima_conexion) {
          const dt = new Date(data.ultima_conexion);
          document.getElementById('header-conexion').innerHTML = `<i class="fa-solid fa-circle text-[7px] mr-1.5 animate-pulse text-emerald-400"></i> Última conexión: ${dt.toLocaleDateString('es-GT')} / ${dt.toLocaleTimeString('es-GT', {hour:'2-digit', minute:'2-digit'})} hrs`;
        }

        if (data.foto_url) {
          document.getElementById('avatar-img').src = data.foto_url;
          document.getElementById('avatar-img').classList.remove('hidden');
          document.getElementById('avatar-icon').classList.add('hidden');
        }
      } catch (err) { console.error(err); }
    }

    async function cargarCentroNotificacionesPerfil() {
      const cont = document.getElementById('lista-notifs-perfil');
      if (!cont || !userSesion || !userSesion.usuario) return;

      try {
        const { data, error } = await supabaseClient
          .from('bitacora_accesos')
          .select('*')
          .eq('usuario', userSesion.usuario)
          .order('id', { ascending: false })
          .limit(10);

        if (error || !data || data.length === 0) {
          cont.innerHTML = '<p class="text-slate-500 text-center py-4 text-xs">No hay registros de conexión recientes.</p>';
          return;
        }

        cont.innerHTML = data.map(b => {
          const dt = new Date(b.fecha_hora || b.fecha || new Date());
          const horaFmt = `${dt.toLocaleDateString('es-GT')} ${dt.toLocaleTimeString('es-GT', {hour:'2-digit', minute:'2-digit'})} hrs`;
          const esIngreso = b.tipo_evento === 'INICIO_SESION';

          return `
            <div class="p-3.5 rounded-2xl bg-slate-900/80 border ${esIngreso ? 'border-emerald-500/30' : 'border-rose-500/30'} flex justify-between items-center text-xs shadow-md">
              <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-xl ${esIngreso ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'} flex items-center justify-center font-bold">
                  <i class="fa-solid ${esIngreso ? 'fa-right-to-bracket' : 'fa-right-from-bracket'} text-sm"></i>
                </div>
                <div>
                  <p class="font-bold text-white">${esIngreso ? 'Inicio de Sesión Exitoso' : 'Cierre de Sesión'}</p>
                  <p class="text-[10px] text-slate-400 font-mono mt-0.5"><i class="fa-regular fa-clock mr-1"></i> ${horaFmt}</p>
                </div>
              </div>
              <span class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-xl text-[10px] font-mono border border-slate-700">Registrado</span>
            </div>
          `;
        }).join('');
      } catch (err) { console.error('Error al cargar conexiones:', err); }
    }

    async function actualizarPerfil(e) {
      e.preventDefault();
      try {
        const { data, error } = await supabaseClient.rpc('actualizar_perfil_usuario', {
          p_usuario: userSesion.usuario,
          p_nombre_completo: document.getElementById('perfil-nombre').value.trim(),
          p_puesto: document.getElementById('perfil-puesto').value.trim(),
          p_fecha_nacimiento: document.getElementById('perfil-nacimiento').value || null,
          p_tiene_hijos: document.getElementById('perfil-hijos').checked
        });

        if (error || !data || !data.success) {
          alert('No se pudo actualizar el perfil: ' + (error?.message || data?.motivo || 'error desconocido'));
          return;
        }

        const sesionActual = obtenerSesionUsuario();
        sesionActual.nombre_completo = document.getElementById('perfil-nombre').value.trim();
        sesionActual.puesto = document.getElementById('perfil-puesto').value.trim();
        guardarSesionUsuario(sesionActual);

        alert('¡Perfil actualizado con éxito!');
        cargarDatosPerfil();
      } catch (err) {
        console.error(err);
        alert('Error inesperado: ' + (err.message || err));
      }
    }

    async function subirFotoPerfil(e) {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const urlPublica = await subirFotoUsuario(file, userSesion.usuario);

        const { data, error } = await supabaseClient.rpc('actualizar_foto_usuario', {
          p_usuario: userSesion.usuario,
          p_foto_url: urlPublica
        });

        if (error || !data || !data.success) {
          alert('No se pudo actualizar la foto en la base de datos.');
          return;
        }

        const sesionActual = obtenerSesionUsuario();
        sesionActual.foto_url = urlPublica;
        guardarSesionUsuario(sesionActual);

        alert('¡Foto actualizada!');
        cargarDatosPerfil();
      } catch (err) {
        console.error(err);
        alert('Error al subir foto: ' + (err.message || err));
      }
    }

    async function cambiarContrasena(e) {
      e.preventDefault();
      const nueva = document.getElementById('clave-nueva').value;
      const confirmar = document.getElementById('clave-confirmar').value;

      if (nueva !== confirmar) {
        alert('Las contraseñas no coinciden.');
        return;
      }

      try {
        const { data, error } = await supabaseClient.rpc('cambiar_password_usuario', {
          p_usuario: userSesion.usuario,
          p_password: nueva
        });

        if (error || !data || !data.success) {
          alert('No se pudo actualizar la contraseña: ' + (error?.message || data?.motivo || 'error desconocido'));
          return;
        }

        alert('¡Contraseña actualizada!');
        document.getElementById('clave-nueva').value = '';
        document.getElementById('clave-confirmar').value = '';
      } catch (err) {
        console.error(err);
        alert('Error inesperado: ' + (err.message || err));
      }
    }
  </script>
</body>
</html>
